name: Release

# Neue Version veröffentlichen:
#   1. "version" in package.json erhöhen
#   2. git tag v0.3.0 && git push --tags
# GitHub baut dann den Windows-Installer und hängt ihn ans Release.
# Buddy Island holt sich das Update danach automatisch.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Installer bauen
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Release anlegen und Dateien hochladen
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Buddy Island $VERSION" \
              --notes "Installer für Windows 10 und 11. Einfach herunterladen und doppelklicken. Bereits installierte Versionen aktualisieren sich automatisch."
          fi
          gh release upload "$TAG" dist/BuddyIsland-Setup-*.exe dist/*.blockmap dist/latest.yml --clobber
