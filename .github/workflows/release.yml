name: Release

# Neue Version veröffentlichen:
#   1. "version" in package.json erhöhen und pushen
#   2. Tag v0.x.y pushen oder diesen Workflow von Hand starten
# GitHub baut den Windows-Installer, signiert das Update (Ed25519) und hängt
# alles ans Release. Installierte Buddys prüfen die Signatur vor dem Update.
#
# Signierschlüssel: Secret BUDDY_UPDATE_SIGNING_KEY (privater Schlüssel, PEM) in der Umgebung
# «release» (Settings → Environments), mit Freigabe durch Wolf. Nicht als Repository-Secret.
# Fehlt er, wird das Release ohne Signatur veröffentlicht. Buddys ab Version 0.3
# installieren es dann nicht automatisch, bis eine Signatur angehängt ist
# (Workflow "Release signieren").

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    # Signierschlüssel liegt als Secret in der Umgebung «release»: nur freigegebene Läufe bekommen ihn
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Schlüsselnachweis einsetzen
        id: stamp
        shell: bash
        env:
          BUDDY_UPDATE_SIGNING_KEY: ${{ secrets.BUDDY_UPDATE_SIGNING_KEY }}
        run: |
          set +e
          node scripts/provenance.js stamp
          code=$?
          set -e
          if [ "$code" = "2" ]; then echo "stamped=false" >> "$GITHUB_OUTPUT"; elif [ "$code" = "0" ]; then echo "stamped=true" >> "$GITHUB_OUTPUT"; else exit "$code"; fi
      - name: Installer bauen
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Build-Nachweis
        if: steps.stamp.outputs.stamped == 'true'
        shell: bash
        env:
          BUDDY_UPDATE_SIGNING_KEY: ${{ secrets.BUDDY_UPDATE_SIGNING_KEY }}
        run: |
          node scripts/provenance.js attest --asar dist/win-unpacked/resources/app.asar --latest dist/latest.yml --out dist/provenance.json
          node scripts/provenance.js verify dist/win-unpacked --provenance dist/provenance.json
      - name: Update signieren
        id: sign
        shell: bash
        env:
          BUDDY_UPDATE_SIGNING_KEY: ${{ secrets.BUDDY_UPDATE_SIGNING_KEY }}
        run: |
          set +e
          node scripts/sign-update.js dist/latest.yml dist/update-signature.json
          code=$?
          set -e
          if [ "$code" = "0" ]; then
            node scripts/sign-update.js --verify dist/update-signature.json dist/latest.yml dist/BuddyIsland-Setup-*.exe
            echo "signed=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" = "2" ]; then
            echo "::warning::Kein Signierschlüssel gesetzt. Das Release ist nicht signiert."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            exit "$code"
          fi
      - name: Release anlegen und Dateien hochladen
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            node scripts/release-notes.js "$VERSION" > release-notes.md
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Buddy Island $VERSION" --notes-file release-notes.md
          fi
          # Signatur vor latest.yml hochladen, damit Buddys sie schon finden, wenn sie das Update sehen
          gh release upload "$TAG" dist/BuddyIsland-Setup-*.exe dist/*.blockmap --clobber
          if [ -f dist/update-signature.json ]; then gh release upload "$TAG" dist/update-signature.json --clobber; fi
          if [ -f dist/provenance.json ]; then gh release upload "$TAG" dist/provenance.json --clobber; fi
          gh release upload "$TAG" dist/latest.yml --clobber
